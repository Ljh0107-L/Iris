name: Integration

# The slow suites, run by hand: the app driven through its UI, and real sessions over SSH to a throwaway
# sshd on the runner. Every model answer comes from a local mock, so no key is needed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: UI and SSH suites
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - name: Install
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/electron/install.js
      - run: npm run test:ui
      - run: npm run test:integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            /tmp/iris-e2e/shots
            /tmp/iris-review-ui
          if-no-files-found: ignore
